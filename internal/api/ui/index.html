// ---------- map ----------

// A small map: tiles when a basemap is chosen, a plain grid otherwise, and a canvas on top
// for aircraft, tracks and the area each sensor is looking at. It needs no library, and
// asks nothing to other servers unless a basemap is turned on.
const TILE = 256;
const basemaps = {
  grid: { name: 'Grid', url: '' },
  osm: { name: 'OpenStreetMap', url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', credit: '© OpenStreetMap contributors' },
};

function loadPref(key, fallback) {
  try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; }
}

function savePref(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* private mode */ }
}

const lonToX = (lon, z) => (lon + 180) / 360 * TILE * 2 ** z;
const latToY = (lat, z) => {
  const s = Math.sin(Math.max(-85.05, Math.min(85.05, lat)) * Math.PI / 180);
  return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * TILE * 2 ** z;
};
const xToLon = (x, z) => x / (TILE * 2 ** z) * 360 - 180;
const yToLat = (y, z) => {
  const n = Math.PI - 2 * Math.PI * y / (TILE * 2 ** z);
  return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
};

// position reached by moving a distance (meters) from a point along a bearing (degrees)
function destination(lat, lon, bearing, dist) {
  const R = 6371000;
  const b = bearing * Math.PI / 180;
  const p1 = lat * Math.PI / 180;
  const l1 = lon * Math.PI / 180;
  const p2 = Math.asin(Math.sin(p1) * Math.cos(dist / R) + Math.cos(p1) * Math.sin(dist / R) * Math.cos(b));
  const l2 = l1 + Math.atan2(Math.sin(b) * Math.sin(dist / R) * Math.cos(p1), Math.cos(dist / R) - Math.sin(p1) * Math.sin(p2));
  return { lat: p2 * 180 / Math.PI, lon: l2 * 180 / Math.PI };
}

function bearing(a, b) {
  const p1 = a.lat * Math.PI / 180;
  const p2 = b.lat * Math.PI / 180;
  const dl = (b.lon - a.lon) * Math.PI / 180;
  const y = Math.sin(dl) * Math.cos(p2);
  const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

function distance(a, b) {
  const R = 6371000;
  const dp = (b.lat - a.lat) * Math.PI / 180;
  const dl = (b.lon - a.lon) * Math.PI / 180;
  const h = Math.sin(dp / 2) ** 2 + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// The area seen by the sensor. Metadata gives its corners in the best case. Otherwise it is
// estimated from the center of the picture, the field of view and the distance from the sensor.
function footprint(t) {
  if (t.corners && t.corners.length === 4) return { points: t.corners, estimated: false };
  if (t.sensorLat === null || t.frameCenterLat === null || t.hfov === null) return null;
  const sensor = { lat: t.sensorLat, lon: t.sensorLon };
  const center = { lat: t.frameCenterLat, lon: t.frameCenterLon };
  const ground = distance(sensor, center);
  const range = t.slantRange || Math.hypot(ground, t.sensorAlt || 0);
  const width = 2 * range * Math.tan(t.hfov * Math.PI / 360);
  const vfov = t.vfov || t.hfov * 9 / 16;
  // a picture taken at a shallow angle covers a longer stretch of ground
  const grazing = Math.max(0.1, Math.min(1, (t.sensorAlt || range) / range));
  const depth = Math.min(2 * range * Math.tan(vfov * Math.PI / 360) / grazing, ground * 1.5 || Infinity);
  const dir = ground > 1 ? bearing(sensor, center) : (t.platformHeading || 0);
  const far = destination(center.lat, center.lon, dir, depth / 2);
  const near = destination(center.lat, center.lon, dir + 180, depth / 2);
  return {
    estimated: true,
    points: [
      destination(far.lat, far.lon, dir - 90, width / 2), destination(far.lat, far.lon, dir + 90, width / 2),
      destination(near.lat, near.lon, dir + 90, width / 2), destination(near.lat, near.lon, dir - 90, width / 2),
    ],
  };
}

const mapViews = {}; // remembered position of each map, by name

// feedsFn returns the feeds to draw: [{name, t}], where t is the telemetry of the feed
function createMap(key, feedsFn, onPick) {
  const view = mapViews[key] || (mapViews[key] = { lat: 0, lon: 0, z: 2, follow: true, fitted: false });
  const tiles = el('div', { class: 'tiles' });
  const canvas = el('canvas', {});
  const credit = el('div', { class: 'credit' });
  const base = el('select', { class: 'base', 'aria-label': 'Basemap' },
    Object.entries(basemaps).map(([k, b]) => el('option', { value: k }, b.name)));
  base.value = basemaps[loadPref('basemap', 'grid')] ? loadPref('basemap', 'grid') : 'grid';
  const followBtn = el('button', { title: 'Follow', 'aria-label': 'Follow', onclick: () => { view.follow = true; view.fitted = false; draw(); } }, '◎');
  const root = el('div', { class: 'map' }, tiles, canvas, base, credit,
    el('div', { class: 'ctl' },
      el('button', { 'aria-label': 'Zoom in', onclick: () => zoom(1) }, '+'),
      el('button', { 'aria-label': 'Zoom out', onclick: () => zoom(-1) }, '−'),
      followBtn));

  base.addEventListener('change', () => { savePref('basemap', base.value); draw(); });
  base.addEventListener('pointerdown', (e) => e.stopPropagation());

  function zoom(d, px, py) {
    const w = root.clientWidth;
    const h = root.clientHeight;
    const z = Math.max(1, Math.min(19, view.z + d));
    if (z === view.z) return;
    if (px !== undefined) {
      // keep the point under the cursor where it is
      const cx = lonToX(view.lon, view.z) + px - w / 2;
      const cy = latToY(view.lat, view.z) + py - h / 2;
      const f = 2 ** (z - view.z);
      view.lon = xToLon(cx * f - (px - w / 2), z);
      view.lat = yToLat(cy * f - (py - h / 2), z);
      view.follow = false;
    }
    view.z = z;
    draw();
  }

  root.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = root.getBoundingClientRect();
    zoom(e.deltaY < 0 ? 1 : -1, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  let drag = null;
  root.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    drag = { x: e.clientX, y: e.clientY, cx: lonToX(view.lon, view.z), cy: latToY(view.lat, view.z), moved: false };
    root.setPointerCapture(e.pointerId);
  });
  root.addEventListener('pointermove', (e) => {
    if (!drag) return;
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 3) drag.moved = true;
    if (!drag.moved) return;
    view.follow = false;
    view.lon = xToLon(drag.cx - (e.clientX - drag.x), view.z);
    view.lat = yToLat(drag.cy - (e.clientY - drag.y), view.z);
    draw();
  });
  root.addEventListener('pointerup', (e) => {
    const d = drag;
    drag = null;
    if (!d || d.moved || !onPick) return;
    const r = root.getBoundingClientRect();
    const hit = hits.find((h) => Math.hypot(h.x - (e.clientX - r.left), h.y - (e.clientY - r.top)) < 18);
    if (hit) onPick(hit.name);
  });

  let hits = [];

  function fit(points) {
    const w = root.clientWidth;
    const h = root.clientHeight;
    const lats = points.map((p) => p.lat);
    const lons = points.map((p) => p.lon);
    view.lat = (Math.min(...lats) + Math.max(...lats)) / 2;
    view.lon = (Math.min(...lons) + Math.max(...lons)) / 2;
    let z = 16;
    for (; z > 2; z--) {
      const dx = lonToX(Math.max(...lons), z) - lonToX(Math.min(...lons), z);
      const dy = latToY(Math.min(...lats), z) - latToY(Math.max(...lats), z);
      if (dx < w * 0.7 && dy < h * 0.7) break;
    }
    view.z = z;
  }

  function draw() {
    const w = root.clientWidth;
    const h = root.clientHeight;
    if (!w || !h) return;

    const list = feedsFn().filter((f) => f.t && f.t.sensorLat !== null && f.t.sensorLon !== null);

    if (view.follow && list.length) {
      const pts = [];
      for (const f of list) {
        pts.push({ lat: f.t.sensorLat, lon: f.t.sensorLon });
        if (f.t.frameCenterLat !== null) pts.push({ lat: f.t.frameCenterLat, lon: f.t.frameCenterLon });
      }
      if (!view.fitted) { fit(pts); view.fitted = true; } else {
        view.lat = pts.reduce((a, p) => a + p.lat, 0) / pts.length;
        view.lon = pts.reduce((a, p) => a + p.lon, 0) / pts.length;
      }
    }
    followBtn.style.color = view.follow ? 'var(--amber)' : '';

    const cx = lonToX(view.lon, view.z);
    const cy = latToY(view.lat, view.z);
    const X = (lon) => lonToX(lon, view.z) - cx + w / 2;
    const Y = (lat) => latToY(lat, view.z) - cy + h / 2;

    // basemap
    const b = basemaps[base.value];
    credit.textContent = b.credit || '';
    const want = new Map();
    if (b.url) {
      const n = 2 ** view.z;
      for (let tx = Math.floor((cx - w / 2) / TILE); tx <= Math.floor((cx + w / 2) / TILE); tx++) {
        for (let ty = Math.floor((cy - h / 2) / TILE); ty <= Math.floor((cy + h / 2) / TILE); ty++) {
          if (ty < 0 || ty >= n) continue;
          const wx = ((tx % n) + n) % n;
          want.set(view.z + '/' + wx + '/' + ty + '@' + tx, { src: b.url.replace('{z}', view.z).replace('{x}', wx).replace('{y}', ty), left: Math.round(tx * TILE - cx + w / 2), top: Math.round(ty * TILE - cy + h / 2) });
        }
      }
    }
    for (const img of [...tiles.children]) {
      const k = img.getAttribute('data-k');
      if (!want.has(k)) { img.remove(); continue; }
      const p = want.get(k);
      img.style.left = p.left + 'px';
      img.style.top = p.top + 'px';
      want.delete(k);
    }
    for (const [k, p] of want) {
      tiles.append(el('img', { class: 'tile', 'data-k': k, src: p.src, alt: '', draggable: 'false', style: 'left:' + p.left + 'px;top:' + p.top + 'px' }));
    }

    // drawing
    const dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
    }
    const g = canvas.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);

    if (!b.url) {
      // graticule, with a spacing that suits the zoom
      const span = xToLon(cx + w / 2, view.z) - xToLon(cx - w / 2, view.z);
      const step = [45, 20, 10, 5, 2, 1, 0.5, 0.2, 0.1, 0.05, 0.02, 0.01, 0.005, 0.002, 0.001].find((x) => span / x >= 3) || 0.001;
      const digits = step >= 1 ? 0 : String(step).split('.')[1].length;
      g.strokeStyle = '#243444';
      g.fillStyle = '#5f7488';
      g.lineWidth = 1;
      g.font = '11px system-ui, sans-serif';
      const lon0 = Math.ceil(xToLon(cx - w / 2, view.z) / step) * step;
      for (let lon = lon0; lon <= xToLon(cx + w / 2, view.z); lon += step) {
        g.beginPath(); g.moveTo(X(lon), 0); g.lineTo(X(lon), h); g.stroke();
        g.fillText(lon.toFixed(digits), X(lon) + 3, h - 5);
      }
      const lat0 = Math.ceil(yToLat(cy + h / 2, view.z) / step) * step;
      for (let lat = lat0; lat <= yToLat(cy - h / 2, view.z); lat += step) {
        g.beginPath(); g.moveTo(0, Y(lat)); g.lineTo(w, Y(lat)); g.stroke();
        g.fillText(lat.toFixed(digits), 4, Y(lat) - 3);
      }
    }

    const stroke = (color, width, dash) => {
      g.setLineDash(dash || []);
      g.lineJoin = 'round';
      g.strokeStyle = 'rgba(10, 15, 21, 0.85)';
      g.lineWidth = width + 2.5;
      g.stroke();
      g.strokeStyle = color;
      g.lineWidth = width;
      g.stroke();
      g.setLineDash([]);
    };

    hits = [];
    for (const f of list) {
      const t = f.t;
      const sx = X(t.sensorLon);
      const sy = Y(t.sensorLat);

      // where the aircraft has been
      if (t.track && t.track.length > 1) {
        g.beginPath();
        t.track.forEach((p, i) => (i ? g.lineTo(X(p.lon), Y(p.lat)) : g.moveTo(X(p.lon), Y(p.lat))));
        stroke('#55b8a8', 2);
      }

      // what the sensor sees
      const fp = footprint(t);
      if (fp) {
        g.beginPath();
        fp.points.forEach((p, i) => (i ? g.lineTo(X(p.lon), Y(p.lat)) : g.moveTo(X(p.lon), Y(p.lat))));
        g.closePath();
        g.fillStyle = 'rgba(240, 181, 73, 0.25)';
        g.fill();
        stroke('#f0b549', 2, fp.estimated ? [6, 4] : null);
      }
      if (t.frameCenterLat !== null) {
        g.beginPath(); g.moveTo(sx, sy); g.lineTo(X(t.frameCenterLon), Y(t.frameCenterLat));
        stroke('#f0b549', 1.5);
      }

      // the aircraft, pointing where it is heading
      g.save();
      g.translate(sx, sy);
      g.rotate((t.platformHeading || 0) * Math.PI / 180);
      g.fillStyle = '#55b8a8';
      g.strokeStyle = '#0e151d';
      g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(0, -11); g.lineTo(7, 8); g.lineTo(0, 4); g.lineTo(-7, 8); g.closePath();
      g.fill(); g.stroke();
      g.restore();

      g.font = '600 12px system-ui, sans-serif';
      const label = f.name;
      const tw = g.measureText(label).width;
      g.fillStyle = 'rgba(19, 28, 38, 0.85)';
      g.fillRect(sx + 10, sy - 9, tw + 8, 18);
      g.fillStyle = '#e8eef4';
      g.fillText(label, sx + 14, sy + 4);

      hits.push({ name: f.name, x: sx, y: sy });
    }
  }

  root.draw = draw;
  new ResizeObserver(draw).observe(root);
  return root;
}

function fmtCoord(lat, lon) {
  return lat.toFixed(5) + ', ' + lon.toFixed(5);
}

function telemetryReadout(t) {
  const rows = [];
  const add = (k, v) => { if (v) rows.push(el('dt', {}, k), el('dd', {}, v)); };
  add('Platform', [t.platformDesignation, t.callSign, t.tailNumber].filter(Boolean).join(', '));
  add('Mission', t.missionID);
  if (t.sensorLat !== null && t.sensorLon !== null) add('Position', fmtCoord(t.sensorLat, t.sensorLon));
  if (t.sensorAlt !== null) add('Altitude', Math.round(t.sensorAlt) + ' m');
  if (t.platformHeading !== null) add('Heading', Math.round(t.platformHeading) + '°');
  if (t.groundSpeed !== null) add('Speed', Math.round(t.groundSpeed) + ' m/s');
  if (t.frameCenterLat !== null && t.frameCenterLon !== null) add('Looking at', fmtCoord(t.frameCenterLat, t.frameCenterLon));
  if (t.slantRange !== null) add('Range', t.slantRange >= 1000 ? (t.slantRange / 1000).toFixed(1) + ' km' : Math.round(t.slantRange) + ' m');
  if (t.hfov !== null) add('Field of view', t.hfov.toFixed(1) + '°');
  add('KLV', t.packets + ' packets' + (t.packetsInvalid ? ', ' + t.packetsInvalid + ' invalid' : '') + (t.packetsRepaired ? ', ' + t.packetsRepaired + ' repaired' : ''));
  return rows;
}

function renderMapSection(name, c, p) {
  const t = p && p.telemetry;
  if (!t) return null;
  const map = createMap('feed:' + name, () => {
    const live = state.paths.find((x) => x.name === name);
    return live && live.telemetry ? [{ name, t: live.telemetry }] : [];
  });
  map.id = 'feed-map';
  return el('section', {},
    map,
    el('dl', { class: 'readout', id: 'feed-readout' }, telemetryReadout(t)),
    el('label', { class: 'switch', style: 'margin:12px 0 0' },
      el('input', {
        type: 'checkbox',
        checked: !!c.klvRepair,
        onchange: (e) => act(e.target.checked ? 'KLV repair on' : 'KLV repair off', () => saveSettings(name, { klvRepair: e.target.checked })),
      }),
      'Repair KLV'));
}

function updateMaps() {
  const m = document.getElementById('feed-map') || document.getElementById('all-map');
  if (m && m.draw) m.draw();
  const r = document.getElementById('feed-readout');
  const p = state.paths.find((x) => x.name === state.selected);
  if (r && p && p.telemetry) r.replaceChildren(...telemetryReadout(p.telemetry));
}

function renderMapView() {
  const main = document.getElementById('main');
  const withPos = () => state.paths.filter((p) => p.telemetry && p.telemetry.sensorLat !== null).map((p) => ({ name: p.name, t: p.telemetry }));
  if (document.getElementById('all-map')) { updateMaps(); return; }
  const map = createMap('all', withPos, (name) => {
    state.view = 'feeds';
    state.selected = name;
    for (const o of document.querySelectorAll('.tabs button')) o.setAttribute('aria-selected', String(o.getAttribute('data-view') === 'feeds'));
    render();
  });
  map.id = 'all-map';
  map.classList.add('big');
  main.replaceChildren(map);
}

// ---------- object detection ----------

function countObjects(d) {
  const counts = new Map();
  for (const o of (d && d.objects) || []) counts.set(o.class, (counts.get(o.class) || 0) + 1);
  return [...counts.entries()].sort((a, b) => b[1] - a[1]);
}

function objectChips(d) {
  return countObjects(d).map(([name, n]) => el('span', { class: 'flag obj' }, n > 1 ? name + ' ' + n : name));
}

// classes of every model that is running, the ones seen most recently first
function knownClasses() {
  const last = new Map();
  for (const p of state.paths) {
    const d = p.detection;
    if (!d) continue;
    for (const c of d.classes) if (!last.has(c)) last.set(c, 0);
    for (const sn of d.seen) last.set(sn.class, Math.max(last.get(sn.class) || 0, new Date(sn.time).getTime()));
  }
  return [...last.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map((e) => e[0]);
}

function lastSeen(p, cls) {
  const sn = p && p.detection && p.detection.seen.find((x) => x.class === cls);
  return sn ? new Date(sn.time).getTime() : 0;
}

// the feeds to list: all of them, or the ones where the chosen class was seen, latest first
function visibleFeeds() {
  const list = feeds();
  const cls = state.classFilter;
  if (!cls) return list;
  return list.filter((f) => lastSeen(f.live, cls) > 0).sort((a, b) => lastSeen(b.live, cls) - lastSeen(a.live, cls));
}

async function refreshModels() {
  try {
    state.models = (await api('GET', '/detect/models/list')).items;
  } catch (e) {
    state.models = [];
  }
}

// boxes are drawn over the player, inside the area actually covered by the picture
function updateOverlay() {
  const overlay = document.getElementById('overlay');
  if (!overlay) return;
  const p = state.paths.find((x) => x.name === state.selected);
  const d = p && p.detection;
  if (!d || !d.frameWidth) { overlay.replaceChildren(); return; }

  const aspect = d.frameWidth / d.frameHeight;
  const stage = 16 / 9;
  const w = aspect >= stage ? 100 : 100 * aspect / stage;
  const h = aspect >= stage ? 100 * stage / aspect : 100;
  overlay.style.cssText = 'left:' + (100 - w) / 2 + '%;top:' + (100 - h) / 2 + '%;width:' + w + '%;height:' + h + '%';

  overlay.replaceChildren(...d.objects.map((o) => el('div', {
    class: 'box',
    style: 'left:' + o.x * 100 + '%;top:' + o.y * 100 + '%;width:' + o.w * 100 + '%;height:' + o.h * 100 + '%',
  }, el('span', {}, o.class + ' ' + Math.round(o.score * 100) + '%'))));
}

function detectStatus(d) {
  if (!d) return 'Starting';
  if (d.error) return d.error;
  if (!d.lastFrame) return 'Starting';
  return d.device + ', ' + Math.round(d.inferenceMs) + ' ms';
}

function updateDetection() {
  updateOverlay();
  const p = state.paths.find((x) => x.name === state.selected);
  const d = p && p.detection;
  const status = document.getElementById('detect-status');
  if (status) status.textContent = detectStatus(d);
  const now = document.getElementById('detect-now');
  if (now) now.replaceChildren(...objectChips(d));
  // the list of classes becomes known a moment after detection starts
  if (now && d && d.classes.length && !document.querySelector('.detail details') && !document.querySelector('.detail :focus')) {
    render();
  }
}

// while a feed with detection is open, its boxes are refreshed more often than the rest of the page
setInterval(async () => {
  if (document.hidden || state.view !== 'feeds' || !state.selected) return;
  const i = state.paths.findIndex((x) => x.name === state.selected);
  if (i < 0 || !state.paths[i].detection) return;
  try {
    const p = await api('GET', '/paths/get/' + encodeName(state.selected));
    const j = state.paths.findIndex((x) => x.name === p.name);
    if (j >= 0) { state.paths[j].detection = p.detection; updateDetection(); }
  } catch (e) { /* the next poll reports it */ }
}, 700);

function renderDetectSection(name, c, p) {
  const d = p && p.detection;
  const section = el('section', {},
    el('label', { class: 'switch', style: c.detect ? '' : 'margin:0' },
      el('input', {
        type: 'checkbox',
        checked: !!c.detect,
        onchange: (e) => act(e.target.checked ? 'Detection on' : 'Detection off', async () => {
          const changes = { detect: e.target.checked };
          if (e.target.checked && !c.detectModel) {
            if (!state.models) await refreshModels();
            const first = state.models.find((m) => !m.error);
            if (!first) throw new Error('no models found. Put a .onnx file in ' + (c.detectModelsDir || './models'));
            changes.detectModel = first.name;
          }
          await saveSettings(name, changes);
        }),
      }),
      'Detect'));

  if (!c.detect) return section;

  const remote = !!c.detectServer;
  const where = el('select', {}, el('option', { value: 'local' }, 'This server'), el('option', { value: 'remote' }, 'Inference server'));
  where.value = remote ? 'remote' : 'local';

  const models = (state.models || []).map((m) => m.name);
  if (!remote && c.detectModel && !models.includes(c.detectModel)) models.unshift(c.detectModel);
  const modelSelect = el('select', {}, models.map((m) => el('option', { value: m }, m)));
  modelSelect.value = c.detectModel || '';
  const modelName = el('input', { type: 'text', value: remote ? c.detectModel || '' : '', placeholder: 'model name', spellcheck: 'false' });
  const server = el('input', { type: 'text', value: c.detectServer || '', placeholder: 'http://host:8000', spellcheck: 'false' });
  const device = el('select', {}, [['auto', 'Auto'], ['cpu', 'CPU'], ['gpu', 'GPU']].map(([v, t]) => el('option', { value: v }, t)));
  device.value = c.detectDevice || 'auto';
  const fps = el('input', { type: 'number', min: '0.1', max: '30', step: '0.1', value: String(c.detectFPS || 2) });
  const frames = el('select', {}, el('option', { value: 'rate' }, 'By frame rate'), el('option', { value: 'key' }, 'Key frames only (lightest)'));
  frames.value = c.detectKeyFramesOnly ? 'key' : 'rate';
  const conf = el('input', { type: 'number', min: '0.05', max: '0.95', step: '0.05', value: String(c.detectConfidence || 0.4) });

  const row = field;
  const localRows = [row('Model', modelSelect), row('Device', device)];
  const remoteRows = [row('Server', server), row('Model', modelName)];
  const fpsRow = row('Frame rate', fps);
  const toggle = () => {
    for (const r of localRows) r.hidden = where.value !== 'local';
    for (const r of remoteRows) r.hidden = where.value !== 'remote';
    fpsRow.hidden = frames.value === 'key';
  };
  where.addEventListener('change', toggle);
  frames.addEventListener('change', toggle);
  toggle();

  section.append(
    row('Run on', where), ...localRows, ...remoteRows,
    row('Analyze', frames), fpsRow, row('Confidence', conf),
    el('div', { class: 'actions' },
      el('button', {
        class: 'btn primary',
        onclick: () => act('Saved', () => saveSettings(name, where.value === 'remote'
          ? { detectServer: server.value.trim(), detectModel: modelName.value.trim(), detectFPS: Number(fps.value), detectKeyFramesOnly: frames.value === 'key', detectConfidence: Number(conf.value) }
          : { detectServer: '', detectModel: modelSelect.value, detectDevice: device.value, detectFPS: Number(fps.value), detectKeyFramesOnly: frames.value === 'key', detectConfidence: Number(conf.value) })),
      }, 'Save'),
      el('span', { class: 'hint', id: 'detect-status', style: 'margin:0;align-self:center' }, detectStatus(d))),
    el('div', { class: 'chips', id: 'detect-now', style: 'margin-top:10px' }, objectChips(d)));

  if (d && d.classes.length) {
    section.append(el('details', { style: 'margin-top:10px' },
      el('summary', { class: 'hint', style: 'margin:0;cursor:pointer' }, d.classes.length + ' classes'),
      el('div', { class: 'chips', style: 'margin-top:8px' }, d.classes.map((cl) => el('button', {
        class: 'flag',
        style: 'background:none;cursor:pointer',
        onclick: () => { state.classFilter = cl; render(); },
      }, cl)))));
  }

  return section;
}

// ---------- changing settings ----------

// Settings are stored per feed. When a feed still uses shared settings,
// a copy is created for it, so that the change does not affect other feeds.
async function saveSettings(name, changes) {
  if (hasOwnConf(name)) {
    await api('PATCH', '/config/paths/patch/' + encodeName(name), changes);
  } else {
    const base = Object.assign({}, confOf(name) || {});
    delete base.name;
    await api('POST', '/config/paths/add/' + encodeName(name), Object.assign(base, changes));
  }
  await refreshConfig();
  await refreshPaths();
}

async function act(label, fn) {
  try {
    await fn();
    if (label) toast(label);
  } catch (e) {
    toast(e.message.charAt(0).toUpperCase() + e.message.slice(1), true);
  }
  render();
}

// ---------- data refresh ----------

async function refreshPaths() {
  const data = await api('GET', '/paths/list?itemsPerPage=1000');
  const now = Date.now();
  for (const p of data.items) {
    const prev = state.prev[p.name];
    if (prev && now > prev.time && p.inboundBytes >= prev.bytes) {
      state.rates[p.name] = (p.inboundBytes - prev.bytes) * 8000 / (now - prev.time);
    } else if (!prev) {
      state.rates[p.name] = null;
    }
    state.prev[p.name] = { bytes: p.inboundBytes, time: now };
  }
  state.paths = data.items;
}

async function refreshConfig() {
  const [global, confs] = await Promise.all([
    api('GET', '/config/global/get'),
    api('GET', '/config/paths/list?itemsPerPage=1000'),
  ]);
  state.global = global;
  state.confs = confs.items;
}

async function refreshRecordings() {
  const data = await api('GET', '/recordings/list?itemsPerPage=1000');
  state.recordings = data.items;
  if (state.recName && !state.recordings.some((r) => r.name === state.recName)) {
    state.recName = null;
  }
  const cur = state.recordings.find((r) => r.name === state.recName);
  state.recSegments = cur ? cur.segments.slice().reverse() : [];
}

// The page asks the server for news every 3 seconds, and only for the list of feeds.
// Settings change rarely, so they are fetched every 30 seconds and after each change.
// Nothing is requested, and no video is played, while the page is not visible.
const POLL_MS = 3000;
const CONFIG_EVERY = 10;

// status of the places the selected feed is being sent to
async function refreshSends() {
  const name = state.selected;
  if (!name) { state.sends = null; return; }
  const c = confOf(name) || {};
  const get = async (n) => {
    // only live feeds have destinations to report; asking for others is an error on the server
    if (!state.paths.some((p) => p.name === n && p.available)) return [];
    try {
      return (await api('GET', '/paths/forward-dests/list?itemsPerPage=1000&path=' + encodeURIComponent(n))).items;
    } catch (e) {
      return [];
    }
  };
  const original = await get(name);
  const compressed = c.compress ? await get(name + c.compressPathSuffix) : [];
  const now = Date.now();
  for (const d of original.concat(compressed)) {
    const prev = state.sendPrev[d.id];
    if (prev && now > prev.time && d.outboundBytes >= prev.bytes) {
      state.sendRates[d.id] = (d.outboundBytes - prev.bytes) * 8000 / (now - prev.time);
    }
    state.sendPrev[d.id] = { bytes: d.outboundBytes, time: now };
  }
  if (state.selected === name) state.sends = { name, original, compressed };
}

let tick = 0;
let polling = false;

async function poll(force) {
  // a page opened in a background tab still loads once, so that it is ready when looked at
  if ((document.hidden && !force) || polling) return;
  polling = true;
  try {
    if (tick % CONFIG_EVERY === 0) {
      state.info = await api('GET', '/info');
      await refreshConfig();
      await refreshFound();
      if (state.view === 'recordings') await refreshRecordings();
    } else if (document.getElementById('found-dialog').open) {
      await refreshFound();
    }
    await refreshPaths();
    if (state.view === 'feeds' && state.selected) await refreshSends();
    state.connected = true;
  } catch (e) {
    state.connected = false;
  }
  polling = false;
  tick++;
  renderServer();
  if (document.getElementById('found-dialog').open) renderFound();
  if (state.view === 'feeds') {
    // the button that opens the list of sources found appears and disappears with them
    const fresh = state.found.items.filter((x) => !x.added).length;
    const btn = document.getElementById('found-btn');
    if (!!btn !== fresh > 0 && !document.querySelector('.detail :focus')) renderFeeds();
    else if (btn) btn.textContent = 'Found ' + fresh;
    updateFeeds();
  } else if (state.view === 'wall') renderWall(false);
  else if (state.view === 'map') renderMapView();
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    // stop every live player: video is by far what uses the most bandwidth
    for (const f of document.querySelectorAll('iframe.screen')) {
      (f.closest('.stage') || f).replaceWith(el('div', { class: 'screen off' }, 'Paused'));
    }
    state.prev = {};
  } else {
    tick = 0;
    poll().then(render);
  }
});

// ---------- top bar ----------

function renderServer() {
  const s = document.getElementById('server');
  if (!state.connected) {
    s.textContent = 'Server unreachable';
    s.className = 'server down';
    return;
  }
  const live = state.paths.filter((p) => p.available).length;
  const viewers = state.paths.reduce((n, p) => n + (p.readerCount || 0), 0);
  s.className = 'server';
  s.textContent = live + ' live, ' + viewers + (viewers === 1 ? ' viewer' : ' viewers');
}

// ---------- feeds view ----------

function stripFor(f) {
  const p = f.live;
  const derived = compressedFrom(f.name);
  const rate = p && p.available ? state.rates[f.name] : 0;
  const tracks = p && p.tracks && p.tracks.length ? p.tracks.join(', ') : '';

  let source = '';
  if (derived) source = 'Compressed';
  else if (p && p.source) source = sourceNames[p.source.type] || p.source.type;

  const viewers = p ? (p.readerCount || 0) : 0;

  return el('div', {
    class: 'strip' + (state.selected === f.name ? ' selected' : '') + (derived ? ' derived' : ''),
    'data-name': f.name,
    tabindex: 0,
    role: 'button',
    onclick: () => select(f.name),
    onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(f.name); } },
  },
  el('span', {
    class: 'tally' + (p && p.recording ? ' rec' : (p && p.available ? ' on' : '')),
    title: p && p.recording ? 'Recording' : (p && p.available ? 'Live' : 'Offline'),
  }),
  el('div', {}, el('div', { class: 'name' }, f.name), el('div', { class: 'sub' }, tracks || 'Offline')),
  el('div', { class: 'sub src' }, source),
  el('div', { class: 'meter' },
    el('div', { class: 'track' }, el('div', { class: 'level', style: 'width:' + meterWidth(rate) + '%' })),
    el('div', { class: 'value' }, p && p.available && rate !== null ? fmtRate(rate) : '')),
  el('div', { class: 'sub viewers' }, viewers + (viewers === 1 ? ' viewer' : ' viewers')),
  el('div', { class: 'flags' },
    objectChips(p && p.detection),
    state.classFilter && p && !countObjects(p.detection).some((e) => e[0] === state.classFilter) && lastSeen(p, state.classFilter)
      ? el('span', { class: 'flag' }, state.classFilter + ' ' + fmtDuration((Date.now() - lastSeen(p, state.classFilter)) / 1000) + ' ago') : null,
    p && p.recording ? el('span', { class: 'flag rec' }, 'Rec') : null,
    !derived && f.conf && f.conf.compress ? el('span', { class: 'flag cmp' }, 'Compress') : null));
}

function renderFeeds() {
  const main = document.getElementById('main');
  const all = feeds();
  const list = visibleFeeds();

  const classes = knownClasses();
  if (state.classFilter && !classes.includes(state.classFilter)) classes.unshift(state.classFilter);
  const filter = classes.length ? el('select', {
    id: 'class-filter',
    'aria-label': 'Filter by detected object',
    style: 'background:var(--panel);border:1px solid var(--rail);border-radius:var(--radius);padding:6px 8px',
    onchange: (e) => { state.classFilter = e.target.value; render(); },
  }, el('option', { value: '' }, 'All feeds'), classes.map((cl) => el('option', { value: cl }, cl))) : null;
  if (filter) filter.value = state.classFilter;

  const fresh = state.found.items.filter((x) => !x.added).length;
  const toolbar = el('div', { class: 'toolbar' },
    filter,
    el('span', { class: 'spacer' }),
    fresh ? el('button', { class: 'btn', id: 'found-btn', onclick: openFound }, 'Found ' + fresh) : null,
    el('button', { class: 'btn primary', onclick: openAddDialog }, 'Add feed'));

  let body;
  if (!list.length && all.length) {
    body = el('div', { class: 'empty' }, el('h2', {}, 'No feeds with ' + state.classFilter));
  } else if (!list.length) {
    const g = state.global;
    const rtsp = g && g.rtsp ? 'rtsp://' + location.hostname + ':' + portOf(g.rtspAddress) + '/camera1' : null;
    body = el('div', { class: 'empty' },
      el('h2', {}, 'No feeds'),
      rtsp ? el('p', {}, 'Add one, or publish to ', el('code', {}, rtsp)) : null);
  } else {
    body = el('div', { class: 'strips', id: 'strips' }, list.map(stripFor));
  }

  // the page skeleton is kept between renders, so that the player of the open feed keeps playing
  let layout = document.getElementById('feeds-layout');
  if (!layout) {
    layout = el('div', { class: 'layout', id: 'feeds-layout' }, el('div', { id: 'feeds-left' }));
    main.replaceChildren(layout);
  }
  layout.classList.toggle('with-panel', !!state.selected);

  const hadFocus = document.activeElement && document.activeElement.closest('#feeds-left .strip');
  const focusName = hadFocus ? hadFocus.getAttribute('data-name') : null;
  document.getElementById('feeds-left').replaceChildren(toolbar, body);
  if (focusName) {
    const again = [...document.querySelectorAll('.strip')].find((x) => x.getAttribute('data-name') === focusName);
    if (again) again.focus();
  }

  const old = layout.querySelector('.detail');
  const panel = state.selected ? renderDetail() : null;

  if (!panel) {
    if (old) old.remove();
  } else if (old && old.getAttribute('data-key') === panel.getAttribute('data-key')) {
    // same feed and same picture: replace everything but the player
    const keep = old.querySelector('section.view');
    const scroll = old.scrollTop;
    for (const ch of [...old.children]) if (ch !== keep) ch.remove();
    const fresh = [...panel.children];
    const at = fresh.findIndex((c) => c.classList.contains('view'));
    for (const ch of fresh.slice(0, at)) old.insertBefore(ch, keep);
    for (const ch of fresh.slice(at + 1)) old.append(ch);
    old.scrollTop = scroll;
  } else if (old) {
    old.replaceWith(panel);
  } else {
    layout.append(panel);
  }
}

// refresh the strips without touching the detail panel, which holds a live player
function updateFeeds() {
  const strips = document.getElementById('strips');
  const list = visibleFeeds();
  const filter = document.getElementById('class-filter');
  const busy = !!document.querySelector('.detail :focus');
  if (!!filter !== knownClasses().length > 0 && !busy) { renderFeeds(); return; }
  if (!strips || strips.children.length !== list.length ||
    list.some((f, i) => strips.children[i].getAttribute('data-name') !== f.name)) {
    if (!busy) renderFeeds();
    return;
  }
  // only the strips whose content changed are replaced, and keyboard focus stays where it was
  list.forEach((f, i) => {
    const cur = strips.children[i];
    const next = stripFor(f);
    if (cur.innerHTML === next.innerHTML && cur.className === next.className) return;
    const focused = document.activeElement === cur;
    cur.replaceWith(next);
    if (focused) next.focus();
  });
  updateViewers();
  updateSends();
  updateDetection();
  // the map section appears as soon as a feed starts carrying metadata
  const panel = document.querySelector('.detail');
  const sel = state.paths.find((x) => x.name === state.selected);
  if (panel && panel.getAttribute('data-telemetry') !== String(!!(sel && sel.telemetry)) && !busy) renderFeeds();
  updateMaps();
}

function select(name) {
  state.selected = state.selected === name ? null : name;
  state.variant = 'original';
  state.sends = null;
  render();
  // on narrow screens the panel sits below the list: bring it into view
  if (state.selected && window.matchMedia('(max-width: 980px)').matches) {
    const panel = document.querySelector('.detail');
    if (panel) panel.scrollIntoView({ block: 'start' });
  }
  refreshSends().then(updateSends, () => {});
  if (state.selected) {
    refreshModels().then(() => { if (!document.querySelector('.detail :focus')) render(); });
  }
}

// ---------- detail panel ----------

function screenFor(name, live) {
  const url = playerURL(name);
  if (!url) {
    return el('div', { class: 'screen off' }, 'WebRTC and HLS are off');
  }
  if (!live) {
    return el('div', { class: 'screen off' }, 'Offline');
  }
  return el('div', { class: 'stage' },
    el('iframe', { class: 'screen', src: url, allow: 'autoplay; fullscreen', title: 'Live view of ' + name }),
    el('div', { class: 'overlay', id: 'overlay' }));
}

function updateViewers() {
  const holder = document.getElementById('viewers');
  if (holder) holder.replaceChildren(...viewerRows());
}

function viewerRows() {
  const live = state.paths.find((p) => p.name === state.selected);
  const readers = (live && live.readers) || [];
  if (!readers.length) return [el('li', {}, el('span', { class: 'grow', style: 'color:var(--dim)' }, 'None'))];
  return readers.map((r) => el('li', {},
    el('span', { class: 'grow' }, readerNames[r.type] || r.type),
    kickEndpoints[r.type] ? el('button', {
      class: 'btn',
      onclick: () => act('Disconnected', () => api('POST', kickEndpoints[r.type] + encodeURIComponent(r.id))),
    }, 'Disconnect') : null));
}

// ---------- where to get a feed ----------

// every address a feed can be read from, according to the servers that are turned on
function feedAddresses(name) {
  const g = state.global;
  if (!g) return [];
  const host = location.hostname;
  const enc = encodeName(name);
  const list = [];

  if (g.rtsp && g.rtspEncryption !== 'strict') {
    list.push(['RTSP', 'rtsp://' + host + ':' + portOf(g.rtspAddress) + '/' + enc]);
  }
  if (g.rtsp && g.rtspEncryption !== 'no') {
    list.push(['RTSPS', 'rtsps://' + host + ':' + portOf(g.rtspsAddress) + '/' + enc]);
  }
  if (g.rtmp && g.rtmpEncryption !== 'strict') {
    list.push(['RTMP', 'rtmp://' + host + ':' + portOf(g.rtmpAddress) + '/' + enc]);
  }
  if (g.rtmp && g.rtmpEncryption !== 'no') {
    list.push(['RTMPS', 'rtmps://' + host + ':' + portOf(g.rtmpsAddress) + '/' + enc]);
  }
  if (g.srt) {
    list.push(['SRT', 'srt://' + host + ':' + portOf(g.srtAddress) + '?streamid=read:' + name]);
  }
  const hls = serverURL(g.hls, g.hlsAddress, g.hlsEncryption);
  if (hls) list.push(['HLS', hls + '/' + enc + '/index.m3u8']);
  const webrtc = serverURL(g.webrtc, g.webrtcAddress, g.webrtcEncryption);
  if (webrtc) {
    list.push(['Web page', webrtc + '/' + enc + '/']);
    list.push(['WHEP', webrtc + '/' + enc + '/whep']);
  }
  return list;
}

function copyText(input) {
  input.select();
  const done = () => toast('Copied');
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(input.value).then(done, () => toast('Copy failed', true));
  } else if (document.execCommand('copy')) { // pages opened over plain HTTP cannot use the clipboard API
    done();
  } else {
    toast('Copy failed', true);
  }
}

function renderAddressSection(shown, isCompressed) {
  const list = feedAddresses(shown);
  const section = el('section', {}, el('h3', {}, isCompressed ? 'Addresses, compressed' : 'Addresses'));

  for (const [label, address] of list) {
    const input = el('input', { type: 'text', readonly: true, value: address, 'aria-label': label + ' address', onfocus: (e) => e.target.select() });
    section.append(el('div', { class: 'field addr' },
      el('label', {}, label),
      el('div', { class: 'copy' }, input, el('button', { class: 'btn', onclick: () => copyText(input) }, 'Copy'))));
  }

  return section;
}

// ---------- sending a feed elsewhere ----------

const sendKinds = [
  ['rtsp', 'RTSP / MediaMTX', 'rtsp://host:8554/'],
  ['rtmp', 'RTMP (YouTube, Twitch)', 'rtmp://a.rtmp.youtube.com/live2#stream-key'],
  ['srt', 'SRT', 'srt://host:8890?streamid=publish:'],
  ['whip', 'WebRTC (WHIP)', 'whip://host:8889/'],
  ['moqt', 'MoQ', 'moqt://host:8893/'],
];

// hide passwords and stream keys when showing an address
function maskAddress(dest) {
  return dest.replace(/\/\/[^/@]*@/, '//\u2022\u2022\u2022@').replace(/#.*$/, '#\u2022\u2022\u2022');
}

function describeCompression(c) {
  const codec = { h264: 'H.264', h265: 'H.265', av1: 'AV1' }[c.compressVideoCodec] || 'H.264';
  return codec + ' ' + (c.compressVideoBitrate || '1000k') + (c.compressVideoHeight ? ' ' + c.compressVideoHeight + 'p' : '');
}

function sendTargets(name) {
  const c = confOf(name) || {};
  const compressedName = name + (c.compressPathSuffix || '_compressed');
  const own = confByName(compressedName);
  return {
    c,
    compressedName,
    original: (c.forward || []).map((d) => d.dest),
    compressed: own ? (own.forward || []).map((d) => d.dest) : [],
  };
}

async function setDestinations(feedName, dests) {
  await saveSettings(feedName, { forward: dests.map((dest) => ({ dest })) });
  await refreshSends();
}

function sendRows() {
  const name = state.selected;
  const t = sendTargets(name);
  const status = state.sends && state.sends.name === name ? state.sends : { original: [], compressed: [] };
  const rows = [];

  const row = (dest, compressed, i) => {
    const st = (compressed ? status.compressed : status.original).find((d) => d.conf && d.conf.dest === dest);
    let text = 'Waiting';
    if (compressed && t.c.compressOnDemand) text = 'Paused, compression is on demand';
    else if (st && st.state === 'forwarding') text = fmtRate(state.sendRates[st.id] || 0);
    else if (st && st.state === 'error') text = st.lastError || 'Error';
    else if (st) text = 'Connecting';

    return el('li', {},
      el('span', { class: 'tally' + (st && st.state === 'forwarding' ? ' on' : (st && st.state === 'error' ? ' rec' : '')) }),
      el('span', { class: 'grow', title: maskAddress(dest) },
        el('div', { style: 'overflow:hidden;text-overflow:ellipsis' }, maskAddress(dest)),
        el('div', { class: 'sub', style: 'color:var(--dim);font-size:13px;white-space:normal' },
          (compressed ? describeCompression(t.c) + ', ' : '') + text)),
      el('button', {
        class: 'btn',
        onclick: () => act('Stopped', () => {
          const list = (compressed ? t.compressed : t.original).filter((_, j) => j !== i);
          return setDestinations(compressed ? t.compressedName : name, list);
        }),
      }, 'Stop'));
  };

  t.original.forEach((d, i) => rows.push(row(d, false, i)));
  t.compressed.forEach((d, i) => rows.push(row(d, true, i)));

  return rows;
}

function updateSends() {
  const holder = document.getElementById('sends');
  if (holder) holder.replaceChildren(...sendRows());
}

function renderSendSection(name, c) {
  const kind = el('select', {}, sendKinds.map(([v, t]) => el('option', { value: v }, t)));
  const address = el('input', { type: 'text', placeholder: sendKinds[0][2] + name, autocomplete: 'off', spellcheck: 'false' });
  const version = el('select', {},
    el('option', { value: 'original' }, 'Original'),
    el('option', { value: 'compressed' }, 'Compressed (' + describeCompression(c) + ')'));

  kind.addEventListener('change', () => {
    const k = sendKinds.find((x) => x[0] === kind.value);
    address.placeholder = k[2] + (k[0] === 'rtmp' ? '' : name);
  });

  const start = () => act('Started', async () => {
    const dest = address.value.trim();
    if (!dest) throw new Error('enter an address');
    const t = sendTargets(name);
    if (version.value === 'compressed') {
      // a compressed copy that is sent somewhere has to be encoded all the time
      if (!c.compress || c.compressOnDemand) {
        await saveSettings(name, { compress: true, compressOnDemand: false });
      }
      await setDestinations(t.compressedName, t.compressed.concat([dest]));
    } else {
      await setDestinations(name, t.original.concat([dest]));
    }
  });

  return el('section', {},
    el('h3', {}, 'Restream'),
    el('ul', { class: 'rows', id: 'sends' }, sendRows()),
    field('To', kind),
    field('Address', address),
    field('Stream', version),
    el('div', { class: 'actions' }, el('button', { class: 'btn primary', onclick: start }, 'Start')));
}

function renderDetail() {
  const name = state.selected;
  const f = feeds().find((x) => x.name === name);
  if (!f) {
    // an unknown feed is deselected, but not before the list of feeds has been loaded
    if (state.connected) state.selected = null;
    return null;
  }

  const p = f.live;
  const c = f.conf || {};
  const derived = compressedFrom(name);
  const own = hasOwnConf(name);
  const live = !!(p && p.available);
  const compressedName = name + (c.compressPathSuffix || '_compressed');
  const shown = state.variant === 'compressed' && c.compress ? compressedName : name;

  // identifies the picture shown by the player: while it stays the same, the player is not rebuilt
  const panel = el('aside', {
    class: 'detail',
    'data-key': [name, shown, live, playerURL(shown), !!c.compress, !!derived].join('|'),
    'data-telemetry': String(!!(p && p.telemetry)),
  });

  panel.append(el('header', {},
    el('span', { class: 'tally' + (p && p.recording ? ' rec' : (live ? ' on' : '')) }),
    el('h2', {}, name),
    el('button', { class: 'btn', onclick: () => select(name), 'aria-label': 'Close' }, 'Close')));

  // live view
  const view = el('section', { class: 'view' });
  view.append(screenFor(shown, live));
  if (c.compress && !derived) {
    view.append(el('div', { class: 'actions' },
      el('div', { class: 'seg' },
        el('button', { 'aria-pressed': String(state.variant === 'original'), onclick: () => { state.variant = 'original'; render(); } }, 'Original'),
        el('button', { 'aria-pressed': String(state.variant === 'compressed'), onclick: () => { state.variant = 'compressed'; render(); } }, 'Compressed'))));
  }
  panel.append(view);

  panel.append(renderAddressSection(shown, shown !== name || !!derived));

  const mapSection = renderMapSection(name, c, p);
  if (mapSection) panel.append(mapSection);

  if (derived) {
    panel.append(el('section', {},
      el('button', { class: 'btn', onclick: () => select(derived) }, 'Open ' + derived)));
    return panel;
  }

  // recording
  panel.append(el('section', {},
    el('label', { class: 'switch rec', style: 'margin:0' },
      el('input', {
        type: 'checkbox',
        checked: !!c.record,
        onchange: (e) => act(e.target.checked ? 'Recording on' : 'Recording off',
          () => saveSettings(name, { record: e.target.checked })),
      }),
      'Record')));

  // compression
  const form = {};
  const fieldRow = field;
  const selectOf = (key, options) => {
    form[key] = el('select', {}, options.map(([v, t]) => el('option', { value: String(v) }, t)));
    const cur = String(c[key] === undefined ? options[0][0] : c[key]);
    if (!options.some(([v]) => String(v) === cur)) form[key].append(el('option', { value: cur }, cur));
    form[key].value = cur;
    return form[key];
  };
  form.compressVideoBitrate = el('input', { type: 'text', value: c.compressVideoBitrate || '1000k', pattern: '[1-9][0-9]*[kKM]?' });

  const comp = el('section', {},
    el('label', { class: 'switch', style: c.compress ? '' : 'margin:0' },
      el('input', {
        type: 'checkbox',
        checked: !!c.compress,
        onchange: (e) => act(e.target.checked ? 'Compression on' : 'Compression off',
          () => saveSettings(name, { compress: e.target.checked })),
      }),
      'Compress'));

  if (c.compress) {
    comp.append(
      fieldRow('Run', selectOf('compressOnDemand', [['true', 'On demand'], ['false', 'Always']])),
      fieldRow('Codec', selectOf('compressVideoCodec', [['h264', 'H.264'], ['h265', 'H.265'], ['av1', 'AV1']])),
      fieldRow('Bitrate', form.compressVideoBitrate),
      fieldRow('Resolution', selectOf('compressVideoHeight', [[0, 'Original'], [1080, '1080p'], [720, '720p'], [480, '480p'], [360, '360p'], [240, '240p']])),
      fieldRow('Frame rate', selectOf('compressVideoFPS', [[0, 'Original'], [30, '30'], [25, '25'], [15, '15'], [10, '10'], [5, '5'], [1, '1']])),
      fieldRow('Quality', selectOf('compressPreset', [['ultrafast', 'Fastest'], ['veryfast', 'Fast'], ['medium', 'Balanced'], ['slow', 'Best']])),
      fieldRow('Audio', selectOf('compressAudioBitrate', [['', 'Original'], ['96k', 'Opus 96k'], ['64k', 'Opus 64k'], ['32k', 'Opus 32k']])),
      el('div', { class: 'actions' },
        el('button', {
          class: 'btn primary',
          onclick: () => act('Saved', () => saveSettings(name, {
            compressOnDemand: form.compressOnDemand.value === 'true',
            compressVideoCodec: form.compressVideoCodec.value,
            compressVideoBitrate: form.compressVideoBitrate.value.trim(),
            compressVideoHeight: Number(form.compressVideoHeight.value),
            compressVideoFPS: Number(form.compressVideoFPS.value),
            compressPreset: form.compressPreset.value,
            compressAudioBitrate: form.compressAudioBitrate.value,
          })),
        }, 'Save')));
  }
  const origRate = state.rates[name];
  const compRate = state.rates[compressedName];
  if (c.compress && origRate && compRate && compRate >= origRate * 0.95) {
    comp.append(el('p', { class: 'hint', style: 'color:var(--amber)' }, 'Not smaller than the original. Lower the bitrate.'));
  }
  panel.append(comp);

  panel.append(renderDetectSection(name, c, p));

  // sending elsewhere
  panel.append(renderSendSection(name, c));

  // viewers
  panel.append(el('section', {},
    el('h3', {}, 'Viewers'),
    el('ul', { class: 'rows', id: 'viewers' }, viewerRows())));

  // feed
  const about = el('section', {});
  if (c.source && c.source !== 'publisher') {
    about.append(el('p', { class: 'hint', style: 'margin:0 0 10px' }, el('code', {}, maskAddress(c.source))));
  }
  if (own) {
    about.append(el('div', { class: 'actions', style: 'margin:0' },
      el('button', {
        class: 'btn danger',
        onclick: () => {
          if (!window.confirm('Remove ' + name + '?')) return;
          act('Removed', async () => {
            await api('DELETE', '/config/paths/delete/' + encodeName(name));
            state.selected = null;
            await refreshConfig();
            await refreshPaths();
          });
        },
      }, 'Remove feed')));
  }
  if (about.children.length) panel.append(about);

  return panel;
}

// ---------- add dialog ----------

function openAddDialog() {
  const d = document.getElementById('add-dialog');
  document.getElementById('add-name').value = '';
  document.getElementById('add-source').value = '';
  d.showModal();
}

document.getElementById('add-dialog').addEventListener('close', (e) => {
  if (e.target.returnValue !== 'ok') return;
  const name = document.getElementById('add-name').value.trim();
  const source = document.getElementById('add-source').value.trim();
  act('Added', async () => {
    await api('POST', '/config/paths/add/' + encodeName(name), source ? { source } : {});
    state.selected = name;
    await refreshConfig();
    await refreshPaths();
  });
});

// ---------- wall view ----------

function wallFeeds() {
  // show each live feed once, and prefer its compressed copy since it is lighter to play
  return feeds()
    .filter((f) => !compressedFrom(f.name) && f.live && f.live.available)
    .map((f) => ({
      name: f.name,
      play: f.conf && f.conf.compress ? f.name + f.conf.compressPathSuffix : f.name,
      compressed: !!(f.conf && f.conf.compress),
      recording: f.live.recording,
    }));
}

let wallKey = '';

function renderWall(force) {
  const list = wallFeeds();
  const key = state.wallCols + '|' + list.map((f) => f.play + (f.recording ? '*' : '')).join('|') + '|' + (playerURL('x') || '');
  if (!force && key === wallKey && document.getElementById('wall-root')) return;
  wallKey = key;

  const main = document.getElementById('main');

  const toolbar = el('div', { class: 'toolbar' },
    el('span', { class: 'spacer' }),
    el('span', { class: 'count' }, 'Columns'),
    el('div', { class: 'seg' }, [1, 2, 3, 4].map((n) => el('button', {
      'aria-pressed': String(state.wallCols === n),
      onclick: () => { state.wallCols = n; renderWall(true); },
    }, n))));

  let body;
  if (!playerURL('x')) {
    body = el('div', { class: 'empty' }, el('h2', {}, 'WebRTC and HLS are off'));
  } else if (!list.length) {
    body = el('div', { class: 'empty' }, el('h2', {}, 'No live feeds'));
  } else {
    body = el('div', { class: 'wall', style: '--cols:' + state.wallCols }, list.map((f) => el('div', { class: 'tile' },
      el('iframe', { class: 'screen', src: playerURL(f.play), loading: 'lazy', allow: 'autoplay; fullscreen', title: 'Live view of ' + f.name }),
      el('div', { class: 'cap' },
        el('span', { class: 'tally ' + (f.recording ? 'rec' : 'on') }),
        el('span', { class: 'grow' }, f.name),
        f.compressed ? el('span', { class: 'flag cmp' }, 'Compressed') : null))));
  }

  main.replaceChildren(el('div', { id: 'wall-root' }, toolbar, body));
}

// ---------- recordings view ----------

function playbackURL() {
  const g = state.global;
  return g ? serverURL(g.playback, g.playbackAddress, g.playbackEncryption) : null;
}

function renderRecordings() {
  const main = document.getElementById('main');
  const base = playbackURL();

  if (!state.recordings.length) {
    main.replaceChildren(el('div', { class: 'empty' },
      el('h2', {}, 'No recordings')));
    return;
  }

  const names = el('div', { class: 'list' }, state.recordings.map((r) => el('button', {
    class: 'item',
    'aria-current': String(r.name === state.recName),
    onclick: () => {
      state.recName = r.name;
      state.recPlaying = null;
      state.recSegments = r.segments.slice().reverse();
      renderRecordings();
    },
  }, el('span', { class: 'grow' }, r.name), el('span', { class: 'n' }, r.segments.length))));

  let right;
  if (!state.recName) {
    right = [];
  } else {
    const rows = state.recSegments.map((s) => el('div', { class: 'segrow' + (state.recPlaying === s.start ? ' playing' : '') },
      el('span', {}, new Date(s.start).toLocaleString()),
      el('span', { class: 'dur' }, fmtDuration(s.duration)),
      el('button', {
        class: 'btn',
        disabled: !base || s.duration === null,
        onclick: () => { state.recPlaying = s.start; renderRecordings(); },
      }, 'Play'),
      el('button', {
        class: 'btn danger',
        onclick: () => {
          if (!window.confirm('Delete this recording?')) return;
          act('Deleted', async () => {
            await api('DELETE', '/recordings/segments/delete?path=' + encodeURIComponent(state.recName) +
              '&start=' + encodeURIComponent(s.start));
            if (state.recPlaying === s.start) state.recPlaying = null;
            await refreshRecordings();
          });
        },
      }, 'Delete')));

    let screen;
    const playing = state.recSegments.find((s) => s.start === state.recPlaying);
    if (!base) {
      screen = el('div', { class: 'screen off' },
        el('div', {},
          el('p', {}, 'Playback is off'),
          el('button', {
            class: 'btn primary',
            onclick: () => act('Playback on', async () => {
              await api('PATCH', '/config/global/patch', { playback: true });
              await refreshConfig();
            }),
          }, 'Turn on')));
    } else if (playing) {
      screen = el('video', {
        class: 'screen',
        controls: true,
        autoplay: true,
        preload: 'metadata',
        src: base + '/get?path=' + encodeURIComponent(state.recName) + '&start=' + encodeURIComponent(playing.start) +
          '&duration=' + encodeURIComponent(playing.duration) + '&format=mp4',
      });
    } else {
      screen = el('div', { class: 'screen off' }, '');
    }

    right = [el('div', { class: 'list' }, rows), el('div', { class: 'viewer' }, screen)];
  }

  main.replaceChildren(el('div', { class: 'rec-layout' }, names, right));
}

// ---------- routing ----------

function writeHash() {
  let h = '#' + state.view;
  if (state.view === 'feeds' && state.selected) h += '/' + encodeName(state.selected);
  if (state.view === 'recordings' && state.recName) h += '/' + encodeName(state.recName);
  if (h === '#feeds') h = location.pathname;
  if ((location.hash || location.pathname) !== h) history.replaceState(null, '', h);
}

function readHash() {
  const m = /^#(feeds|wall|map|recordings|settings)(?:\/(.+))?$/.exec(location.hash);
  if (!m) return;
  const name = m[2] ? decodeURIComponent(m[2]) : null;
  state.view = m[1];
  if (m[1] === 'feeds') state.selected = name;
  if (m[1] === 'recordings') state.recName = name;
  for (const o of document.querySelectorAll('.tabs button')) {
    o.setAttribute('aria-selected', String(o.getAttribute('data-view') === state.view));
  }
}

function render() {
  writeHash();
  if (state.view === 'feeds') renderFeeds();
  else if (state.view === 'wall') renderWall(true);
  else if (state.view === 'map') renderMapView();
  else if (state.view === 'settings') renderSettings();
  else renderRecordings();
}

for (const b of document.querySelectorAll('.tabs button')) {
  b.addEventListener('click', async () => {
    state.view = b.getAttribute('data-view');
    for (const o of document.querySelectorAll('.tabs button')) {
      o.setAttribute('aria-selected', String(o === b));
    }
    if (state.view === 'recordings') {
      try { await refreshRecordings(); } catch (e) { toast(e.message, true); }
    }
    render();
  });
}

window.addEventListener('hashchange', async () => {
  readHash();
  if (state.view === 'recordings') { try { await refreshRecordings(); } catch (e) { /* shown as empty */ } }
  render();
});

(async () => {
  readHash();
  await poll(true);
  if (state.view === 'recordings') { try { await refreshRecordings(); } catch (e) { /* shown as empty */ } }
  if (state.selected) { refreshSends().then(updateSends, () => {}); refreshModels().then(render); }
  render();
  setInterval(poll, POLL_MS);
})();
</script>
