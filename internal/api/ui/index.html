<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediaMTX</title>
<style>
:root {
  --bay: #131c26;
  --panel: #1b2733;
  --panel-2: #223040;
  --rail: #2f4154;
  --ink: #e8eef4;
  --dim: #93a6b8;
  --tally: #e5484d;
  --amber: #f0b549;
  --signal: #55b8a8;
  --radius: 6px;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bay);
  color: var(--ink);
  font: 15px/1.45 "Avenir Next", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}

button, input, select {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--amber);
  outline-offset: 2px;
}

/* ---------- top bar ---------- */

.bar {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 0 20px;
  height: 56px;
  background: var(--panel);
  border-bottom: 1px solid var(--rail);
  position: sticky;
  top: 0;
  z-index: 5;
}

.bar h1 {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.01em;
  white-space: nowrap;
}

.tabs {
  display: flex;
  gap: 2px;
  height: 100%;
}

.tabs button {
  background: none;
  border: 0;
  border-bottom: 3px solid transparent;
  padding: 3px 14px 0;
  color: var(--dim);
  cursor: pointer;
}

.tabs button[aria-selected="true"] {
  color: var(--ink);
  border-bottom-color: var(--amber);
}

.bar .server {
  margin-left: auto;
  color: var(--dim);
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.bar .server.down { color: var(--tally); }

/* ---------- shared pieces ---------- */

main { padding: 20px; }

.btn {
  background: var(--panel-2);
  border: 1px solid var(--rail);
  border-radius: var(--radius);
  padding: 6px 12px;
  cursor: pointer;
  white-space: nowrap;
}

.btn:hover { border-color: var(--dim); }

.btn.primary {
  background: var(--amber);
  border-color: var(--amber);
  color: #1c1503;
  font-weight: 600;
}

.btn.danger { color: #ff9a9d; }

.btn:disabled { opacity: 0.5; cursor: default; }

.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.toolbar .count { color: var(--dim); }

.toolbar .spacer { flex: 1; }

.empty {
  max-width: 62ch;
  margin: 56px auto;
  color: var(--dim);
}

.empty h2 {
  color: var(--ink);
  font-size: 20px;
  font-weight: 600;
  margin: 0 0 8px;
}

.empty code, .hint code {
  background: var(--panel);
  border: 1px solid var(--rail);
  border-radius: 4px;
  padding: 1px 6px;
  color: var(--ink);
  font-size: 13px;
  word-break: break-all;
}

.tally {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--rail);
  flex: none;
}

.tally.on { background: var(--signal); }

.tally.rec {
  background: var(--tally);
  box-shadow: 0 0 0 3px rgba(229, 72, 77, 0.25);
}

/* ---------- feeds: one channel strip per feed ---------- */

.strips {
  border: 1px solid var(--rail);
  border-radius: var(--radius);
  overflow: hidden;
}

.strip {
  display: grid;
  grid-template-columns: 20px minmax(140px, 1.4fr) minmax(70px, 0.6fr) minmax(150px, 1.2fr) 80px minmax(150px, 1.4fr);
  align-items: center;
  gap: 16px;
  padding: 12px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--rail);
  cursor: pointer;
}

.strip:last-child { border-bottom: 0; }

.strip:hover, .strip.selected { background: var(--panel-2); }

.strip.selected { box-shadow: inset 3px 0 0 var(--amber); }

.strip .name {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.strip .sub {
  color: var(--dim);
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.strip.derived .name { font-weight: 400; padding-left: 14px; }
.strip.derived .name::before { content: "\21B3  "; color: var(--dim); }

/* bitrate meter: the signal level of each feed */
.meter .track {
  height: 6px;
  background: var(--bay);
  border-radius: 3px;
  overflow: hidden;
}

.meter .level {
  height: 100%;
  width: 0;
  background: var(--signal);
  border-radius: 3px;
  transition: width 0.6s ease;
}

.meter .value {
  font-size: 13px;
  color: var(--dim);
  margin-top: 4px;
}

.strip .flags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: flex-end;
}

.flag {
  font-size: 12px;
  border: 1px solid var(--rail);
  border-radius: 999px;
  padding: 1px 9px;
  color: var(--dim);
  white-space: nowrap;
}

.flag.rec { color: #ff9a9d; border-color: rgba(229, 72, 77, 0.6); }
.flag.cmp { color: var(--amber); border-color: rgba(240, 181, 73, 0.5); }

/* ---------- detail panel ---------- */

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 20px;
  align-items: start;
}

.layout.with-panel { grid-template-columns: minmax(0, 1fr) minmax(360px, 440px); }

.detail {
  background: var(--panel);
  border: 1px solid var(--rail);
  border-radius: var(--radius);
  position: sticky;
  top: 76px;
  max-height: calc(100vh - 96px);
  overflow: auto;
}

.detail header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--rail);
}

.detail header h2 {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
}

.detail section {
  padding: 14px 16px;
  border-bottom: 1px solid var(--rail);
}

.detail section:last-child { border-bottom: 0; }

.detail h3 {
  margin: 0 0 10px;
  font-size: 14px;
  font-weight: 600;
}

.screen {
  background: #000;
  aspect-ratio: 16 / 9;
  width: 100%;
  border: 0;
  display: block;
}

.screen.off {
  display: grid;
  place-items: center;
  color: var(--dim);
  padding: 16px;
  text-align: center;
  font-size: 14px;
}

.seg {
  display: inline-flex;
  border: 1px solid var(--rail);
  border-radius: var(--radius);
  overflow: hidden;
}

.seg button {
  background: none;
  border: 0;
  padding: 4px 12px;
  cursor: pointer;
  color: var(--dim);
}

.seg button[aria-pressed="true"] {
  background: var(--panel-2);
  color: var(--ink);
}

.field {
  display: grid;
  grid-template-columns: 96px 1fr;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.field label { color: var(--dim); font-size: 14px; }

.field input[type="text"], .field input[type="number"], .field select, dialog input[type="text"] {
  width: 100%;
  background: var(--bay);
  border: 1px solid var(--rail);
  border-radius: var(--radius);
  padding: 6px 8px;
}

.copy { display: flex; gap: 6px; min-width: 0; }

.copy input { flex: 1; min-width: 0; text-overflow: ellipsis; }

.map {
  position: relative;
  overflow: hidden;
  background: #0e151d;
  aspect-ratio: 16 / 10;
  width: 100%;
  touch-action: none;
  cursor: grab;
  user-select: none;
}

.map.big { aspect-ratio: auto; height: calc(100vh - 150px); min-height: 320px; border: 1px solid var(--rail); border-radius: var(--radius); }

.map .tiles { position: absolute; inset: 0; filter: brightness(0.62) saturate(0.6) contrast(1.1); }

.map img.tile { position: absolute; width: 256px; height: 256px; max-width: none; pointer-events: none; }

.map canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

.map .ctl {
  position: absolute;
  top: 8px;
  right: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.map .ctl button, .map .base {
  background: var(--panel);
  border: 1px solid var(--rail);
  border-radius: var(--radius);
  color: var(--ink);
  min-width: 32px;
  height: 32px;
  cursor: pointer;
}

.map .base { position: absolute; left: 8px; top: 8px; padding: 0 6px; }

.map .credit { position: absolute; right: 6px; bottom: 4px; font-size: 11px; color: var(--dim); background: rgba(19, 28, 38, 0.7); padding: 0 4px; }

.readout { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; margin-top: 10px; }

.readout dt { color: var(--dim); }

.readout dd { margin: 0; }

.stage { position: relative; }

.overlay {
  position: absolute;
  pointer-events: none;
}

.overlay .box {
  position: absolute;
  border: 2px solid var(--amber);
  border-radius: 2px;
}

.overlay .box span {
  position: absolute;
  left: -2px;
  bottom: 100%;
  background: var(--amber);
  color: #1c1503;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.3;
  padding: 0 4px;
  white-space: nowrap;
}

.flag.obj { color: var(--ink); border-color: var(--dim); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.switch {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  cursor: pointer;
}

.switch input {
  appearance: none;
  width: 38px;
  height: 22px;
  border-radius: 11px;
  background: var(--rail);
  position: relative;
  cursor: pointer;
  flex: none;
  margin: 0;
}

.switch input::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--ink);
  transition: left 0.15s ease;
}

.switch input:checked { background: var(--amber); }
.switch input:checked::after { left: 19px; background: #1c1503; }
.switch.rec input:checked { background: var(--tally); }
.switch.rec input:checked::after { background: #fff; }

.hint {
  color: var(--dim);
  font-size: 13px;
  margin: 6px 0 0;
  max-width: 60ch;
}

.rows { list-style: none; margin: 0; padding: 0; }

.rows li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  font-size: 14px;
}

.rows li .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* ---------- wall ---------- */

.wall {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
}

.tile {
  background: var(--panel);
  border: 1px solid var(--rail);
  border-radius: var(--radius);
  overflow: hidden;
}

.tile .cap {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  font-size: 14px;
}

.tile .cap .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- recordings ---------- */

.rec-layout {
  display: grid;
  grid-template-columns: minmax(160px, 220px) minmax(300px, 420px) minmax(0, 1fr);
  gap: 20px;
  align-items: start;
}

.rec-layout .viewer {
  position: sticky;
  top: 76px;
}

.list {
  background: var(--panel);
  border: 1px solid var(--rail);
  border-radius: var(--radius);
  overflow: hidden;
}

.list button.item {
  display: flex;
  width: 100%;
  gap: 10px;
  text-align: left;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--rail);
  padding: 10px 12px;
  cursor: pointer;
}

.list button.item:last-child { border-bottom: 0; }
.list button.item:hover, .list button.item[aria-current="true"] { background: var(--panel-2); }
.list button.item[aria-current="true"] { box-shadow: inset 3px 0 0 var(--amber); }
.list .item .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .item .n { color: var(--dim); }

video.screen { background: #000; }

.segrow {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  gap: 10px;
  align-items: center;
  padding: 8px 12px;
  border-bottom: 1px solid var(--rail);
  font-size: 14px;
}

.segrow:last-child { border-bottom: 0; }
.segrow.playing { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--amber); }
.segrow .dur { color: var(--dim); text-align: right; }

/* ---------- dialog and toast ---------- */

dialog {
  background: var(--panel);
  color: var(--ink);
  border: 1px solid var(--rail);
  border-radius: var(--radius);
  padding: 20px;
  width: min(480px, calc(100vw - 32px));
}

dialog::backdrop { background: rgba(8, 12, 17, 0.7); }

dialog h2 { margin: 0 0 14px; font-size: 18px; font-weight: 600; }

#found-dialog { width: min(680px, calc(100vw - 32px)); }

.found {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(110px, 170px) auto;
  gap: 10px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--rail);
}

.found .sub { color: var(--dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.found input {
  background: var(--bay);
  border: 1px solid var(--rail);
  border-radius: var(--radius);
  padding: 6px 8px;
  width: 100%;
}

.settings { max-width: 640px; display: grid; gap: 16px; }

.settings section {
  background: var(--panel);
  border: 1px solid var(--rail);
  border-radius: var(--radius);
  padding: 16px;
}

.settings h2 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }

.settings .field { grid-template-columns: 130px 1fr; }

.settings textarea {
  width: 100%;
  min-height: 64px;
  background: var(--bay);
  border: 1px solid var(--rail);
  border-radius: var(--radius);
  padding: 6px 8px;
  color: inherit;
  font: inherit;
  resize: vertical;
}

dialog label.block { display: block; color: var(--dim); font-size: 14px; margin: 12px 0 4px; }

#toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  background: var(--panel-2);
  border: 1px solid var(--rail);
  border-left: 3px solid var(--signal);
  border-radius: var(--radius);
  padding: 10px 16px;
  max-width: min(640px, calc(100vw - 32px));
  z-index: 20;
}

#toast.error { border-left-color: var(--tally); }
#toast[hidden] { display: none; }

@media (max-width: 980px) {
  .layout.with-panel { grid-template-columns: minmax(0, 1fr); }
  .detail { position: static; max-height: none; }
  .strip { grid-template-columns: 20px minmax(0, 1fr) minmax(110px, 150px); }
  .strip .src, .strip .viewers, .strip .flags { display: none; }
  .rec-layout { grid-template-columns: minmax(0, 1fr); }
  .rec-layout .viewer { position: static; order: -1; }
  .wall { grid-template-columns: repeat(min(var(--cols, 3), 2), minmax(0, 1fr)); }
  .bar { gap: 12px; padding: 0 12px; }
  .bar .server { display: none; }
  main { padding: 12px; }
}

@media (max-width: 560px) {
  .wall { grid-template-columns: minmax(0, 1fr); }
  .field { grid-template-columns: minmax(0, 1fr); gap: 4px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<div class="bar">
  <h1>MediaMTX</h1>
  <div class="tabs" role="tablist">
    <button role="tab" data-view="feeds" aria-selected="true">Feeds</button>
    <button role="tab" data-view="wall" aria-selected="false">Wall</button>
    <button role="tab" data-view="map" aria-selected="false">Map</button>
    <button role="tab" data-view="recordings" aria-selected="false">Recordings</button>
    <button role="tab" data-view="settings" aria-selected="false">Settings</button>
  </div>
  <div class="server" id="server"></div>
</div>

<main id="main"></main>

<dialog id="add-dialog">
  <form method="dialog" id="add-form">
    <h2>Add feed</h2>
    <label class="block" for="add-name">Name</label>
    <input type="text" id="add-name" required pattern="[0-9a-zA-Z_\-/\.]+" placeholder="front-door" autocomplete="off">
    <label class="block" for="add-source">Source address (optional)</label>
    <input type="text" id="add-source" placeholder="rtsp://192.168.1.20:554/stream" autocomplete="off">
    <div class="actions">
      <button class="btn primary" value="ok">Add</button>
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
    </div>
  </form>
</dialog>

<dialog id="found-dialog">
  <h2>Found on the network</h2>
  <div id="found-list"></div>
  <div class="actions"><button class="btn" id="found-close">Close</button></div>
</dialog>

<div id="toast" hidden role="status"></div>

<script>
'use strict';

// ---------- state ----------

const state = {
  view: 'feeds',
  info: null,
  global: null,
  paths: [],          // live paths, from the API
  confs: [],          // path configurations
  rates: {},          // path name -> inbound bits per second
  prev: {},           // path name -> {bytes, time}
  selected: null,     // name of the feed shown in the detail panel
  variant: 'original',
  wallCols: 3,
  recordings: [],
  recName: null,
  recSegments: [],
  recPlaying: null,
  connected: false,
  found: { enabled: false, items: [] }, // video sources found on the network
  models: null,       // detection models available on the server
  classFilter: '',    // show only feeds where this class was detected
  sends: null,        // status of the destinations of the selected feed
  sendPrev: {},       // destination id -> {bytes, time}
  sendRates: {},      // destination id -> bits per second
};

// ---------- helpers ----------

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v === null || v === undefined) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'checked' || k === 'disabled' || k === 'value') e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}

async function api(method, path, body) {
  const res = await fetch('/v3' + path, {
    method,
    headers: body !== undefined ? { 'Content-Type': 'application/json' } : {},
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) {
    throw new Error((data && data.error) || ('the server replied with status ' + res.status));
  }
  return data;
}

let toastTimer = null;

function toast(text, isError) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.className = isError ? 'error' : '';
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, isError ? 8000 : 3500);
}

function fmtRate(bps) {
  if (!bps) return '0 kbit/s';
  if (bps >= 1e6) return (bps / 1e6).toFixed(2) + ' Mbit/s';
  return Math.round(bps / 1e3) + ' kbit/s';
}

function fmtDuration(secs) {
  if (secs === null || secs === undefined) return '';
  secs = Math.round(secs);
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  return (h ? h + 'h ' : '') + (h || m ? m + 'm ' : '') + s + 's';
}

function fmtSince(iso) {
  if (!iso) return '';
  return fmtDuration((Date.now() - new Date(iso).getTime()) / 1000);
}

// the meter is logarithmic: 50 kbit/s is empty, 20 Mbit/s is full
function meterWidth(bps) {
  if (!bps || bps <= 5e4) return bps ? 2 : 0;
  return Math.min(100, Math.max(2, 100 * Math.log(bps / 5e4) / Math.log(2e7 / 5e4)));
}

const sourceNames = {
  rtspSession: 'RTSP',
  rtspsSession: 'RTSPS',
  rtmpConn: 'RTMP',
  rtmpsConn: 'RTMPS',
  srtConn: 'SRT',
  webRTCSession: 'WebRTC',
  moqSession: 'MoQ',
  rtspSource: 'RTSP camera',
  rtmpSource: 'RTMP pull',
  hlsSource: 'HLS pull',
  srtSource: 'SRT pull',
  webRTCSource: 'WebRTC pull',
  moqSource: 'MoQ pull',
  mpegtsSource: 'MPEG-TS',
  rtpSource: 'RTP',
  rpiCameraSource: 'Raspberry Pi camera',
  redirect: 'Redirect',
};

const readerNames = {
  hlsSession: 'HLS',
  rtmpConn: 'RTMP',
  rtmpsConn: 'RTMPS',
  rtspSession: 'RTSP',
  rtspsSession: 'RTSPS',
  srtConn: 'SRT',
  webRTCSession: 'WebRTC',
  moqSession: 'MoQ',
};

const kickEndpoints = {
  hlsSession: '/hls/sessions/kick/',
  rtmpConn: '/rtmp/conns/kick/',
  rtmpsConn: '/rtmps/conns/kick/',
  rtspSession: '/rtsp/sessions/kick/',
  rtspsSession: '/rtsps/sessions/kick/',
  srtConn: '/srt/conns/kick/',
  webRTCSession: '/webrtc/sessions/kick/',
  moqSession: '/moq/sessions/kick/',
};

function encodeName(name) {
  return name.split('/').map(encodeURIComponent).join('/');
}

function portOf(address) {
  const i = (address || '').lastIndexOf(':');
  return i >= 0 ? address.slice(i + 1) : '';
}

function serverURL(enabled, address, encrypted) {
  if (!enabled) return null;
  return (encrypted ? 'https' : 'http') + '://' + location.hostname + ':' + portOf(address);
}

// address of the page that plays a feed in the browser
function playerURL(name) {
  const g = state.global;
  if (!g) return null;
  const webrtc = serverURL(g.webrtc, g.webrtcAddress, g.webrtcEncryption);
  if (webrtc) return webrtc + '/' + encodeName(name) + '/';
  const hls = serverURL(g.hls, g.hlsAddress, g.hlsEncryption);
  if (hls) return hls + '/' + encodeName(name) + '/';
  return null;
}

function confByName(name) {
  return state.confs.find((c) => c.name === name) || null;
}

// settings that apply to a feed: its own, or the shared ones it falls under
function confOf(name) {
  const own = confByName(name);
  if (own) return own;
  const live = state.paths.find((p) => p.name === name);
  return live ? confByName(live.confName) : null;
}

function hasOwnConf(name) {
  return confByName(name) !== null;
}

// name of the feed a compressed feed is made from, or null
function compressedFrom(name) {
  for (const f of feeds()) {
    const c = f.conf;
    if (c && c.compress && f.name + c.compressPathSuffix === name) return f.name;
  }
  return null;
}

// every feed worth showing: live paths plus configured ones that are not live
function feeds() {
  const byName = new Map();
  for (const p of state.paths) {
    byName.set(p.name, { name: p.name, live: p });
  }
  for (const c of state.confs) {
    if (c.name.startsWith('~') || c.name === 'all_others' || c.name === 'all') continue;
    if (!byName.has(c.name)) byName.set(c.name, { name: c.name, live: null });
  }
  const list = [...byName.values()];
  for (const f of list) {
    f.conf = confByName(f.name) || (f.live ? confByName(f.live.confName) : null);
  }
  list.sort((a, b) => a.name.localeCompare(b.name));
  return list;
}

// a labelled control. The label is tied to the control so that it is announced by screen readers
// and so that clicking it focuses the control.
let fieldSeq = 0;

function field(label, input, cls) {
  if (!input.id) input.id = 'f' + (++fieldSeq);
  return el('div', { class: 'field' + (cls ? ' ' + cls : '') }, el('label', { for: input.id }, label), input);
}

// ---------- sources found on the network ----------

async function refreshFound() {
  try {
    state.found = await api('GET', '/discovery/list');
  } catch (e) {
    state.found = { enabled: false, items: [] };
  }
}

const foundMethods = { sap: 'Announced', multicast: 'Multicast', onvif: 'Camera', tak: 'TAK' };

function suggestName(src) {
  const base = (src.name || src.address || 'feed').toLowerCase().replace(/^[a-z+]+:\/\//, '');
  let name = base.replace(/[^0-9a-z_.-]+/g, '-').replace(/^-+|-+$/g, '') || 'feed';
  const taken = new Set(state.confs.map((c) => c.name));
  for (let i = 2; taken.has(name); i++) name = name.replace(/-\d+$/, '') + '-' + i;
  return name;
}

function renderFound() {
  const list = document.getElementById('found-list');
  const items = state.found.items.filter((x) => !x.added);
  if (!items.length) {
    list.replaceChildren(el('p', { class: 'hint' }, 'Nothing new'));
    return;
  }
  // rows being edited are kept, so that typing a name is not interrupted
  const existing = new Map([...list.querySelectorAll('.found')].map((r) => [r.getAttribute('data-id'), r]));
  list.replaceChildren(...items.map((src) => {
    if (existing.has(src.id)) return existing.get(src.id);
    const name = el('input', { type: 'text', value: suggestName(src), 'aria-label': 'Name', pattern: '[0-9a-zA-Z_\\-/\\.]+' });
    const address = el('input', { type: 'text', value: src.source, 'aria-label': 'Address', spellcheck: 'false' });
    return el('div', { class: 'found', 'data-id': src.id },
      el('div', { style: 'min-width:0' },
        el('div', { class: 'sub', style: 'margin-bottom:4px' }, [...new Set([foundMethods[src.method] || src.method, src.name, src.info].filter(Boolean))].join(', ')),
        address),
      name,
      el('button', {
        class: 'btn primary',
        onclick: () => act('Added', async () => {
          await api('POST', '/config/paths/add/' + encodeName(name.value.trim()),
            Object.assign({ source: address.value.trim() }, src.conf || {}));
          await refreshConfig();
          await refreshPaths();
          await refreshFound();
          renderFound();
        }),
      }, 'Add'));
  }));
}

document.getElementById('found-close').addEventListener('click', () => document.getElementById('found-dialog').close());

function openFound() {
  renderFound();
  document.getElementById('found-dialog').showModal();
}
